# Dev variant of fact_checker_policy_optimization for iterating on the search engine.
# All component names use the _dev suffix so this can run alongside production.
fact_checker_policy_optimization_dev:
  resources_servers:
    fact_checker_policy_optimization_dev:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Dev variant — hallucination reward using a fact checker (search engine under development)
      fact_checker_agent_server:
        type: responses_api_agents
        name: fact_checker_policy_optimization_dev_fact_checker
      fact_checker_responses_create_params:
        input: []
        max_output_tokens: 16384
        temperature: 1.0
        top_p: 1.0
      kiwix_zim_dir: null
      kiwix_port: 8082
      kiwix_serve_path: null
      kiwix_max_chars: 8000
      kiwix_top_k: 3
      bm25s_index_dir: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemotron_nano/users/abukharin/midtraining/deep_research/OpenResearcher/Tevatron/openresearcher-indexes/bm25s-openresearcher
      bm25s_db_path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemotron_nano/users/abukharin/midtraining/deep_research/OpenResearcher/corpus.db
      bm25s_max_chars: 18000
      judge_model_server:
        type: responses_api_models
        name: fact_checker_dev_judge_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 2048
        temperature: 0.0
        top_p: 1.0
      use_wiki_search_tool: true

fact_checker_policy_optimization_dev_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: fact_checker_policy_optimization_dev
      model_server:
        type: responses_api_models
        name: policy_model

fact_checker_policy_optimization_dev_fact_checker:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: fact_checker_policy_optimization_dev
      model_server:
        type: responses_api_models
        name: fact_checker_dev_model
      max_steps: 10

fact_checker_dev_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: http://127.0.0.1:8000/v1
      api_key: dummy_key
      model: __FACT_CHECKER_MODEL_OVERRIDE_ME__
      return_token_id_information: false
      uses_reasoning_parser: true
      chat_template_kwargs:
        enable_thinking: true
      spinup_server: true
      router_dp_size: 1
      server_args:
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9
        max_model_len: 65536
        trust_remote_code: true
        enable_auto_tool_choice: true
        tool_call_parser: qwen3_coder
        reasoning_parser: deepseek_r1

fact_checker_dev_judge_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: http://127.0.0.1:8000/v1
      api_key: dummy_key
      model: __FACT_CHECKER_JUDGE_MODEL_OVERRIDE_ME__
      return_token_id_information: false
      uses_reasoning_parser: false
      spinup_server: true
      router_dp_size: 1
      server_args:
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9
        max_model_len: 65536
