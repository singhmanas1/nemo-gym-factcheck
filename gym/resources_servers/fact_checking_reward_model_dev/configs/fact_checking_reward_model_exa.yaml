# Fact-checking agent whose search_wiki calls Exa instead of EmbeddingGemma + Milvus.
# Scoring is the same dev verifier (line-count num_errors, YES/NO matcher, F1 vs
# expected_errors). Gold rows are data/rlhf24_final_audited_dataset.jsonl.
fact_checking_reward_model_dev:
  resources_servers:
    fact_checking_reward_model_dev:
      entrypoint: app.py
      domain: rlhf
      verified: false
      description: fact-checking reward model (F1 + severity) with Exa search.
      search_top_k: 3
      max_result_chars: 8000
      search_cache_size: 10000
      retrieval_backend: exa
      exa_api_key: ${oc.env:EXA_API_KEY}
      exa_base_url: https://api.exa.ai
      exa_search_type: auto
      exa_timeout_seconds: 30.0
      exa_max_characters: 8000
      summarize_retrieval_results: false
      tantivy_index_dir: null
      corpus_db_path: null
      judge_model_server:
        type: responses_api_models
        name: fact_checking_dev_judge_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 4096
        temperature: 0.6
        top_p: 1.0
      judge_empty_retries: 2
      rubric_parallel_evaluation: true
      factuality_weight: 1.0
      f_beta: 1.0
      severity_weight: 0.1

fact_checking_reward_model_exa_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: fact_checking_reward_model_dev
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 10
      max_search_calls: 3
      skip_duplicate_search_queries: true
      hyde_search_queries: true
      force_first_step_tool_choice: required
      force_final_step_tool_choice: none
      default_max_output_tokens: 16384
      datasets:
        - name: rlhf24
          type: example
          jsonl_fpath: ../data/rlhf24_final_audited_dataset.jsonl

fact_checking_dev_judge_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: "http://127.0.0.1:8001/v1"
      api_key: dummy_key
      model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
      return_token_id_information: false
      uses_reasoning_parser: true
      spinup_server: false
      router_dp_size: 1
      server_args: {}
