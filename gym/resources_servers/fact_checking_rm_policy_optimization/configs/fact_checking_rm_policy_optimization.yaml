# Downstream policy optimization using a trained severity fact-checker GenRM.
#
# Flow:
#   1. Policy generates a single-turn response to a user prompt.
#   2. Verifier formats (conversation, response) with the fact-checker prompt.
#   3. Trained fact-checker runs with the evaluation Tantivy-backed search_wiki.
#   4. Frozen pointwise GenRM independently predicts response quality (1-5).
#   5. The verifier combines normalized factual severity and GenRM quality.
#
# Reward (policy training), selected by reward_combination:
#   weighted_sum: unlabeled_severity_weight * (6 - predicted_severity) / 5
#                 + genrm_score_weight * (genrm_quality_score - 1) / 4
#   min:          min((6 - predicted_severity) / 5,
#                     (genrm_quality_score - 1) / 4)
fact_checking_rm_policy_optimization:
  resources_servers:
    fact_checking_rm_policy_optimization:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Composite downstream reward from local-Tantivy fact-check severity and pointwise GenRM quality
      checker_agent_server:
        type: responses_api_agents
        name: fact_checking_rm_policy_optimization_checker_agent
      checker_responses_create_params:
        input: []
        max_output_tokens: 16384
        temperature: 1.0
        top_p: 1.0
      genrm_agent_server:
        type: responses_api_agents
        name: fact_checking_rm_policy_optimization_genrm_agent
      genrm_responses_create_params:
        input: []
        max_output_tokens: 8192
        temperature: 0.0
        top_p: 1.0
      # Search is served by fact_checking_reward_model_dev below. This
      # composite verifier itself does not own the retrieval index.
      retrieval_backend: none
      corpus_db_path: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemotron_nano/users/abukharin/midtraining/deep_research/OpenResearcher/corpus.db
      max_result_chars: 8000
      search_cache_size: 10000
      tantivy_index_dir: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemotron_nano/users/abukharin/midtraining/deep_research/OpenResearcher/tantivy-openresearcher
      tantivy_stage_local: true
      tantivy_local_root: /tmp
      tantivy_candidate_pool: 10
      use_context_aware_prompt: false
      search_log_path: null
      artifact_log_path: null
      judge_model_server: null
      judge_responses_create_params:
        input: []
        max_output_tokens: 4096
        temperature: 0.6
        top_p: 1.0
      rubric_parallel_evaluation: true
      factuality_weight: 1.0
      severity_weight: 0.1
      unlabeled_severity_weight: 1.0
      genrm_score_weight: 1.0
      reward_combination: weighted_sum
      missing_genrm_score_reward: 0.0
      reward_for_parse_failure: 0.0

fact_checking_rm_policy_optimization_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: fact_checking_rm_policy_optimization
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 1

fact_checking_rm_policy_optimization_checker_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # Match the Step-220 FastFact evaluation: the checker gets search_wiki
      # from the Tantivy-backed fact_checking_reward_model_dev server.
      resources_server:
        type: resources_servers
        name: fact_checking_reward_model_dev
      model_server:
        type: responses_api_models
        name: fact_checking_rm_policy_optimization_checker_model
      max_steps: 10

fact_checking_rm_policy_optimization_genrm_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: fact_checking_rm_policy_optimization
      model_server:
        type: responses_api_models
        name: fact_checking_rm_policy_optimization_genrm_model
      max_steps: 1

fact_checking_rm_policy_optimization_checker_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: http://127.0.0.1:8000/v1
      api_key: dummy_key
      model: __FACT_CHECKING_RM_POLICY_OPTIMIZATION_CHECKER_MODEL_OVERRIDE_ME__
      return_token_id_information: false
      # The checker returns delimited text plus tool calls.  Do not install a
      # custom reasoning parser in this standalone vLLM process: unlike the
      # policy server it starts from Gym's responses_api_models directory, so
      # repo-relative parser plugin paths are invalid here.
      uses_reasoning_parser: false
      chat_template_kwargs:
        enable_thinking: true
      spinup_server: true
      router_dp_size: 1
      server_args:
        tensor_parallel_size: 4
        gpu_memory_utilization: 0.9
        max_model_len: 40960
        trust_remote_code: true
        enable_auto_tool_choice: true
        tool_call_parser: qwen3_coder

fact_checking_rm_policy_optimization_genrm_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: http://127.0.0.1:8000/v1
      api_key: dummy_key
      model: __FACT_CHECKING_RM_POLICY_OPTIMIZATION_GENRM_MODEL_OVERRIDE_ME__
      return_token_id_information: false
      # The pointwise GenRM score is parsed from the explicit Quality Score
      # block, so exposing a separate reasoning field is unnecessary.
      uses_reasoning_parser: false
      chat_template_kwargs:
        enable_thinking: true
      spinup_server: true
      router_dp_size: 1
      server_args:
        tensor_parallel_size: 4
        gpu_memory_utilization: 0.9
        max_model_len: 32768
        trust_remote_code: true
