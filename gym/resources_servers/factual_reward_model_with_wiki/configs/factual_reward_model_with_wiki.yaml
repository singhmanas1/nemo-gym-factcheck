# GenRM with Wiki: starts Kiwix when the server starts (set kiwix_zim_dir).
factual_reward_model_with_wiki:
  resources_servers:
    factual_reward_model_with_wiki:
      entrypoint: app.py
      domain: rlhf
      verified: false
      description: Factual reward model with Kiwix Wikipedia access
      # Set to a directory containing .zim files to start kiwix-serve with this server (e.g. /data/zim).
      # Omit or leave unset to run without Kiwix.
      # kiwix_zim_dir: /data/zim
      kiwix_zim_dir: /lustre/fs1/portfolios/llmservice/users/abukharin/fact-rm/zim_files
      kiwix_port: 8082
      # Full path to kiwix-serve binary if not on PATH (e.g. inside extracted kiwix-tools_linux-x86_64-3.7.0).
      kiwix_serve_path: /lustre/fs1/portfolios/llmservice/users/abukharin/fact-rm/kiwix-tools_linux-x86_64-3.7.0/kiwix-serve
      kiwix_max_chars: 8000   # max article text (chars) returned to model
      kiwix_top_k: 3          # number of articles to fetch per search
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 2048
        temperature: 0.0
        top_p: 1.0
      rubric_parallel_evaluation: true

factual_reward_model_with_wiki_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: factual_reward_model_with_wiki
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: train
          type: train
          jsonl_fpath: resources_servers/factual_reward_model_with_wiki/data/train.jsonl
          gitlab_identifier:
            dataset_name: rlhf_2.4
            version: 0.0.1
            artifact_fpath: rlhf_2.4.jsonl
          huggingface_identifier:
            repo_id: nvidia/Nemotron-RL-generative_reward_model
            artifact_fpath: rlhf_2.4.jsonl
          license: Apache 2.0
        - name: example
          type: example
          jsonl_fpath: resources_servers/factual_reward_model_with_wiki/data/example.jsonl

