# Joint Factual RM Policy Optimization: trains a policy model against the trained
# joint factual reward model (factuality + quality) with Wikipedia retrieval.
joint_factual_rm_policy_optimization:
  resources_servers:
    joint_factual_rm_policy_optimization:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Downstream reward using the joint factual+quality RM
      rm_agent_server:
        type: responses_api_agents
        name: joint_factual_rm_policy_optimization_rm_agent
      rm_responses_create_params:
        input: []
        max_output_tokens: 16384
        temperature: 1.0
        top_p: 1.0
      kiwix_zim_dir: /lustre/fs1/portfolios/llmservice/users/abukharin/fact-rm/zim_files/wikipedia_all
      kiwix_port: 8082
      kiwix_serve_path: /lustre/fs1/portfolios/llmservice/users/abukharin/fact-rm/kiwix-tools_linux-x86_64-3.7.0/kiwix-serve
      kiwix_max_chars: 8000
      kiwix_top_k: 3
      judge_model_server:
        type: responses_api_models
        name: joint_factual_rm_judge_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 2048
        temperature: 0.0
        top_p: 1.0
      use_wiki_search_tool: true
      factuality_weight: 0.5
      quality_weight: 0.5

joint_factual_rm_policy_optimization_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: joint_factual_rm_policy_optimization
      model_server:
        type: responses_api_models
        name: policy_model

joint_factual_rm_policy_optimization_rm_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: joint_factual_rm_policy_optimization
      model_server:
        type: responses_api_models
        name: joint_factual_rm_model
      max_steps: 10

joint_factual_rm_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: http://127.0.0.1:8000/v1
      api_key: dummy_key
      model: __JOINT_FACTUAL_RM_MODEL_OVERRIDE_ME__
      return_token_id_information: false
      uses_reasoning_parser: true
      chat_template_kwargs:
        enable_thinking: true
      spinup_server: true
      router_dp_size: 1
      server_args:
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9
        max_model_len: 32768
        trust_remote_code: true
        enable_auto_tool_choice: true
        tool_call_parser: qwen3_coder
        reasoning_parser: deepseek_r1

joint_factual_rm_judge_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: http://127.0.0.1:8000/v1
      api_key: dummy_key
      model: __JOINT_FACTUAL_RM_JUDGE_MODEL_OVERRIDE_ME__
      return_token_id_information: false
      uses_reasoning_parser: false
      spinup_server: true
      router_dp_size: 1
      server_args:
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9
        max_model_len: 65536
