# Sequential Joint Factual RM Policy Optimization
#
# Two-step inference against the joint factual RM:
#   Step 1 — RM agent (with wiki tool calls) generates through factuality prediction.
#             Output is truncated at [End of Factuality Prediction].
#   Step 2 — RM model is called directly with the step-1 output as an assistant-turn
#             prefix, so it sees the factuality verdict before generating quality score.
#
# Reward = factuality_weight * factuality_reward + quality_weight * quality_reward
sequential_joint_factual_rm_policy_optimization:
  resources_servers:
    sequential_joint_factual_rm_policy_optimization:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Sequential two-step joint factual+quality RM evaluation
      rm_agent_server:
        type: responses_api_agents
        name: sequential_joint_factual_rm_policy_optimization_rm_agent
      rm_responses_create_params:
        input: []
        max_output_tokens: 16384
        temperature: 1.0
        top_p: 1.0
      rm_model_server:
        type: responses_api_models
        name: joint_factual_rm_model
      rm_step2_responses_create_params:
        input: []
        max_output_tokens: 1024
        temperature: 1.0
        top_p: 1.0
      kiwix_zim_dir: /lustre/fs1/portfolios/llmservice/users/abukharin/fact-rm/zim_files/wikipedia_all
      kiwix_port: 8082
      kiwix_serve_path: /lustre/fs1/portfolios/llmservice/users/abukharin/fact-rm/kiwix-tools_linux-x86_64-3.7.0/kiwix-serve
      kiwix_max_chars: 8000
      kiwix_top_k: 3
      judge_model_server:
        type: responses_api_models
        name: joint_factual_rm_judge_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 2048
        temperature: 0.0
        top_p: 1.0
      use_wiki_search_tool: true
      factuality_weight: 0.5
      quality_weight: 0.5

sequential_joint_factual_rm_policy_optimization_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: sequential_joint_factual_rm_policy_optimization
      model_server:
        type: responses_api_models
        name: policy_model

sequential_joint_factual_rm_policy_optimization_rm_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: sequential_joint_factual_rm_policy_optimization
      model_server:
        type: responses_api_models
        name: joint_factual_rm_model
      max_steps: 10

# joint_factual_rm_model and joint_factual_rm_judge_model are shared with
# joint_factual_rm_policy_optimization — include that config alongside this one.
