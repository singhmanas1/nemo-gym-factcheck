# Non-Milvus retrieval: Tavily web search (same search_wiki tool).
# Requires TAVILY_API_KEY in the environment.
fact_checking_reward_model_tavily:
  resources_servers:
    fact_checking_reward_model_tavily:
      tavily_api_key: ${oc.env:TAVILY_API_KEY}
      tavily_max_results: 5
      tavily_cache_file: /home/ec2-user/tavily_cache.json
      judge_model_server:
        type: responses_api_models
        name: policy_model

policy_model:
  responses_api_models:
    vllm_model:
      uses_reasoning_parser: false
      spinup_server: false
